name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag version $version does not match package.json version $package_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: Verify and package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm check
          pnpm test

      - name: Build release archive
        run: pnpm zip

      - name: Prepare release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          cp .output/*-chrome.zip "release-assets/multi-ai-workspace-${VERSION}-chrome.zip"
          cp scripts/install-latest.ps1 "release-assets/install-latest.ps1"
          cd release-assets
          sha256sum \
            "multi-ai-workspace-${VERSION}-chrome.zip" \
            install-latest.ps1 \
            > "multi-ai-workspace-${VERSION}-SHA256SUMS.txt"
          sha256sum -c "multi-ai-workspace-${VERSION}-SHA256SUMS.txt"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [validate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(cat <<'EOF'
          ## Installation

          Download `multi-ai-workspace-VERSION-chrome.zip`, extract it, then open `chrome://extensions`, enable Developer mode, and choose **Load unpacked**.

          Windows users can run `powershell -NoProfile -ExecutionPolicy Bypass -File .\install-latest.ps1 INSTALL_ARGS` to fetch, verify, and extract this release channel automatically. Chrome requires the final **Load unpacked** confirmation for extensions distributed outside the Chrome Web Store.
          EOF
          )"
          notes="${notes//VERSION/$VERSION}"
          prerelease_args=()
          install_args=""
          if [[ "$TAG" == *-* ]]; then
            prerelease_args+=(--prerelease)
            install_args="-IncludePrerelease"
          fi
          notes="${notes//INSTALL_ARGS/$install_args}"
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Multi AI Workspace $TAG" \
            --notes "$notes" \
            --generate-notes \
            "${prerelease_args[@]}"
